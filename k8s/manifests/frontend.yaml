---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: birthdayapp
  labels:
    app: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      serviceAccountName: birthdayapp-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: frontend
          image: acrdevnavarlabp3sc.azurecr.io/birthdayapp/frontend:dev
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          # Readiness now verifies backend reachability through the internal nginx proxy.
          readinessProbe:
            httpGet:
              path: /api/healthz
              port: 8080
            # Slightly larger initial delay to allow backend + DNS resolution
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
            successThreshold: 1
          # Liveness remains a lightweight local check (NGINX only)
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 30
            timeoutSeconds: 2
            failureThreshold: 3
            successThreshold: 1
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: birthdayapp
  labels:
    app: frontend
spec:
  selector:
    app: frontend
  ports:
    - name: http
      port: 80
      targetPort: 8080
  type: ClusterIP
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: frontend-pdb
  namespace: birthdayapp
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: frontend
