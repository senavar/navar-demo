global:
  registry: ""
  namespace: "birthdayapp"

image:
  frontend:
    repository: birthdayapp/frontend
    tag: "dev"          
    digest: ""          
    pullPolicy: IfNotPresent
    replicas: 2
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 128Mi
    hpa:
      enabled: true
      minReplicas: 2
      maxReplicas: 4
      targetCPUUtilizationPercentage: 60
  backend:
    repository: birthdayapp/backend
    tag: "dev"
    digest: ""
    pullPolicy: IfNotPresent
    replicas: 2
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi
    hpa:
      enabled: true
      minReplicas: 2
      maxReplicas: 6
      targetCPUUtilizationPercentage: 70

serviceAccountName: birthdayapp-sa

ingress:
  enabled: true
  className: nginx-internal
  host: "*.losnavar.com"

networkPolicy:
  backend:
    enabled: true
    mongoCIDR: 10.10.3.4/32
    # Additional Azure FQDNs (besides login.microsoftonline.com automatically allowed) that backend needs (e.g. management.azure.com, storage account endpoints)
    azureExtraFQDNs: []

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false

annotations: {}

appVersionOverride: ""

azureBlob:
  enabled: false            # default off so helm lint/template works without providing secrets
  # When enabling, you must set accountName and container (or lint will fail due to required())
  accountName: ""          # e.g. mystorageacct
  container: ""            # e.g. birthdays-images
  urlFormat: ""            # optional e.g. https://cdn.example.com/{container}/{blob}

scheduling:
  nodeSelector:
    agentpool: "user"      
  tolerations: []
  affinity: {}

probes:
  frontend:
    readiness:
      path: /api/healthz
      initialDelaySeconds: 10
      periodSeconds: 10
      timeoutSeconds: 2
      failureThreshold: 3
      successThreshold: 1
    liveness:
      path: /healthz
      initialDelaySeconds: 20
      periodSeconds: 30
      timeoutSeconds: 2
      failureThreshold: 3
      successThreshold: 1
  backend:
    startup:
      path: /api/healthz
      periodSeconds: 3
      failureThreshold: 20
      timeoutSeconds: 2
    readiness:
      path: /api/healthz
      initialDelaySeconds: 8
      periodSeconds: 10
      timeoutSeconds: 2
      failureThreshold: 3
      successThreshold: 1
    liveness:
      path: /api/healthz
      initialDelaySeconds: 40
      periodSeconds: 30
      timeoutSeconds: 2
      failureThreshold: 3
      successThreshold: 1

workloadIdentity:
  backend:
    enabled: true  # set to true to add label azure.workload.identity/use: "true" on backend pods

