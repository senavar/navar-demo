{{- if .Values.networkPolicy.backend.enabled }}
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: backend-cnp
  namespace: {{ include "birthdayapp.namespace" . }}
spec:
  endpointSelector:
    matchLabels:
      app: backend
  ingress:
    - fromEndpoints:
        - matchLabels:
            app: frontend
        - matchLabels:
            app.kubernetes.io/name: ingress-nginx
      toPorts:
        - ports:
            - port: "8000"
              protocol: TCP
  egress:
    - toEndpoints:
        - matchLabels:
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    - toCIDR:
        - {{ .Values.networkPolicy.backend.mongoCIDR | quote }}
      toPorts:
        - ports:
            - port: "27017"
              protocol: TCP
    - toFQDNs:
        - matchName: login.microsoftonline.com
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
    {{- if .Values.networkPolicy.backend.azureExtraFQDNs }}
    - toFQDNs:
        {{- range .Values.networkPolicy.backend.azureExtraFQDNs }}
        - matchName: {{ . | quote }}
        {{- end }}
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
    {{- end }}
    {{- if and .Values.azureBlob.enabled .Values.networkPolicy.backend.autoAddStorageAccountFQDN .Values.azureBlob.accountName }}
    - toFQDNs:
        - matchName: {{ printf "%s.blob.core.windows.net" .Values.azureBlob.accountName | quote }}
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
    {{- end }}
    {{- if .Values.networkPolicy.backend.azureServiceFQDNPatterns }}
    - toFQDNs:
        {{- range .Values.networkPolicy.backend.azureServiceFQDNPatterns }}
        - matchPattern: {{ . | quote }}
        {{- end }}
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
    {{- end }}
    {{- if .Values.networkPolicy.backend.privateEndpointCIDRs }}
    - toCIDR:
        {{- range .Values.networkPolicy.backend.privateEndpointCIDRs }}
        - {{ . | quote }}
        {{- end }}
      {{- $ports := .Values.networkPolicy.backend.privateEndpointPorts }}
      {{- if or (not $ports) (eq (len $ports) 0) }}
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
      {{- else }}
      toPorts:
        - ports:
            {{- range $ports }}
            - port: "{{ . }}"
              protocol: TCP
            {{- end }}
      {{- end }}
    {{- end }}
{{- end }}
