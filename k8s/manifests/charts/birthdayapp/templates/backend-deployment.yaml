apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: {{ include "birthdayapp.namespace" . }}
  labels:
    app: backend
    app.kubernetes.io/name: backend
    app.kubernetes.io/version: {{ include "birthdayapp.version" . }}
spec:
  replicas: {{ .Values.image.backend.replicas }}
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
        app.kubernetes.io/name: backend
        app.kubernetes.io/version: {{ include "birthdayapp.version" . }}
        {{- if .Values.workloadIdentity.backend.enabled }}
        azure.workload.identity/use: "true"
        {{- end }}
    spec:
      serviceAccountName: {{ .Values.serviceAccountName }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with .Values.scheduling.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.scheduling.affinity }}
      {{- if (not (empty .)) }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- end }}
      {{- with .Values.scheduling.tolerations }}
      {{- if (gt (len .) 0) }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- end }}
      containers:
        - name: backend
          image: {{ include "birthdayapp.image" (list . .Values.image.backend) }}
          imagePullPolicy: {{ .Values.image.backend.pullPolicy }}
          ports:
            - containerPort: 8000
          env:
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: GUNICORN_WORKERS
              value: "2"
            - name: GUNICORN_THREADS
              value: "4"
            - name: MONGO_URI_FILE
              value: /mnt/secrets-store/mongo-conn-string
            - name: MONGO_URI_REFRESH_SECONDS
              value: "60"
            {{- if .Values.azureBlob.enabled }}
            - name: AZURE_STORAGE_ACCOUNT_NAME
              value: "{{ required "azureBlob.accountName is required when azureBlob.enabled=true" .Values.azureBlob.accountName }}"
            - name: AZURE_BLOB_CONTAINER
              value: "{{ required "azureBlob.container is required when azureBlob.enabled=true" .Values.azureBlob.container }}"
            {{- if .Values.azureBlob.urlFormat }}
            - name: AZURE_BLOB_URL_FORMAT
              value: "{{ .Values.azureBlob.urlFormat }}"
            {{- end }}
            {{- end }}
          volumeMounts:
            - name: instance
              mountPath: /app/instance
            - name: mongo-conn
              mountPath: /mnt/secrets-store
              readOnly: true
          {{- with .Values.probes.backend.startup }}
          startupProbe:
            httpGet:
              path: {{ .path | default "/api/healthz" }}
              port: 8000
            periodSeconds: {{ .periodSeconds | default 3 }}
            failureThreshold: {{ .failureThreshold | default 20 }}
            timeoutSeconds: {{ .timeoutSeconds | default 2 }}
          {{- end }}
          {{- with .Values.probes.backend.readiness }}
          readinessProbe:
            httpGet:
              path: {{ .path | default "/api/healthz" }}
              port: 8000
            initialDelaySeconds: {{ .initialDelaySeconds | default 8 }}
            periodSeconds: {{ .periodSeconds | default 10 }}
            timeoutSeconds: {{ .timeoutSeconds | default 2 }}
            failureThreshold: {{ .failureThreshold | default 3 }}
            successThreshold: {{ .successThreshold | default 1 }}
          {{- end }}
          {{- with .Values.probes.backend.liveness }}
          livenessProbe:
            httpGet:
              path: {{ .path | default "/api/healthz" }}
              port: 8000
            initialDelaySeconds: {{ .initialDelaySeconds | default 40 }}
            periodSeconds: {{ .periodSeconds | default 30 }}
            timeoutSeconds: {{ .timeoutSeconds | default 2 }}
            failureThreshold: {{ .failureThreshold | default 3 }}
            successThreshold: {{ .successThreshold | default 1 }}
          {{- end }}
          resources:
            {{- toYaml .Values.image.backend.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
      volumes:
        - name: instance
          emptyDir: {}
        - name: mongo-conn
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: app-secrets
