apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: {{ include "birthdayapp.namespace" . }}
  labels:
    app: backend
    app.kubernetes.io/name: backend
    app.kubernetes.io/version: {{ include "birthdayapp.version" . }}
spec:
  replicas: {{ .Values.image.backend.replicas }}
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
        app.kubernetes.io/name: backend
        app.kubernetes.io/version: {{ include "birthdayapp.version" . }}
    spec:
      serviceAccountName: {{ .Values.serviceAccountName }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with .Values.scheduling.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.scheduling.affinity }}
      {{- if (not (empty .)) }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- end }}
      {{- with .Values.scheduling.tolerations }}
      {{- if (gt (len .) 0) }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- end }}
      containers:
        - name: backend
          image: {{ include "birthdayapp.image" .Values.image.backend }}
          imagePullPolicy: {{ .Values.image.backend.pullPolicy }}
          ports:
            - containerPort: 8000
          env:
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: GUNICORN_WORKERS
              value: "2"
            - name: GUNICORN_THREADS
              value: "4"
            - name: MONGO_URI_FILE
              value: /mnt/secrets-store/mongo-conn-string
            - name: MONGO_URI_REFRESH_SECONDS
              value: "60"
            {{- if .Values.azureBlob.enabled }}
            - name: AZURE_STORAGE_ACCOUNT_NAME
              value: "{{ required "azureBlob.accountName is required when azureBlob.enabled=true" .Values.azureBlob.accountName }}"
            - name: AZURE_BLOB_CONTAINER
              value: "{{ required "azureBlob.container is required when azureBlob.enabled=true" .Values.azureBlob.container }}"
            {{- if .Values.azureBlob.urlFormat }}
            - name: AZURE_BLOB_URL_FORMAT
              value: "{{ .Values.azureBlob.urlFormat }}"
            {{- end }}
            {{- end }}
          volumeMounts:
            - name: instance
              mountPath: /app/instance
            - name: mongo-conn
              mountPath: /mnt/secrets-store
              readOnly: true
          readinessProbe:
            httpGet:
              path: /api/healthz
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/healthz
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 30
            failureThreshold: 3
          resources:
            {{- toYaml .Values.image.backend.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
      volumes:
        - name: instance
          emptyDir: {}
        - name: mongo-conn
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: app-secret
