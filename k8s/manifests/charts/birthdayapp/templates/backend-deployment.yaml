apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: {{ include "birthdayapp.namespace" . }}
  labels:
    app: backend
    app.kubernetes.io/name: backend
    app.kubernetes.io/version: {{ include "birthdayapp.version" . }}
spec:
  replicas: {{ .Values.image.backend.replicas }}
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
        app.kubernetes.io/name: backend
        app.kubernetes.io/version: {{ include "birthdayapp.version" . }}
    spec:
      serviceAccountName: {{ .Values.serviceAccountName }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: backend
          image: {{ include "birthdayapp.image" .Values.image.backend }}
          imagePullPolicy: {{ .Values.image.backend.pullPolicy }}
          ports:
            - containerPort: 8000
          env:
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: GUNICORN_WORKERS
              value: "2"
            - name: GUNICORN_THREADS
              value: "4"
            - name: MONGO_URI_FILE
              value: /mnt/secrets-store/mongo-conn-string
            - name: MONGO_URI_REFRESH_SECONDS
              value: "60"
          volumeMounts:
            - name: instance
              mountPath: /app/instance
            - name: mongo-conn
              mountPath: /mnt/secrets-store
              readOnly: true
          readinessProbe:
            httpGet:
              path: /api/healthz
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/healthz
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 30
            failureThreshold: 3
          resources:
            {{- toYaml .Values.image.backend.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
      volumes:
        - name: instance
          emptyDir: {}
        - name: mongo-conn
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: app-secret
