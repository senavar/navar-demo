name: Setup Azure Tooling
description: Minimal install of Docker (ensure daemon), Azure CLI, kubectl (via az), and Helm for self-hosted runners
runs:
  using: composite
  steps:
    - name: Prepare bin & PATH
      shell: bash
      run: |
        set -Eeuo pipefail
        mkdir -p "$HOME/.local/bin"
        if ! echo "$PATH" | tr ':' '\n' | grep -Fxq "$HOME/.local/bin"; then
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
        fi
        # Export for current step (subsequent steps get it from GITHUB_PATH)
        export PATH="$HOME/.local/bin:$PATH"
        echo "User bin ready at: $HOME/.local/bin"
    - name: Docker (ensure available)
      shell: bash
      run: |
        set -Eeuo pipefail
        echo "[Docker] Ensuring docker CLI present and daemon running"
        if ! command -v docker >/dev/null 2>&1; then
          echo "docker CLI not found. Attempting lightweight install."
          if [ -f /etc/debian_version ]; then
            curl -fsSL https://get.docker.com -o /tmp/get-docker.sh
            sh /tmp/get-docker.sh || { echo "Docker install script failed" >&2; exit 1; }
          else
            echo "Auto-install unsupported on this distro. Please pre-provision Docker." >&2
            # Do not hard fail yet; continue to allow alternative build strategies later.
            exit 0
          fi
        fi
        # Try to communicate with daemon; if unavailable attempt to start it.
        if ! docker info >/dev/null 2>&1; then
          echo "Docker daemon not responding. Attempting start via system service..."
          sudo systemctl start docker 2>/dev/null || sudo service docker start 2>/dev/null || true
        fi
        if ! docker info >/dev/null 2>&1; then
          echo "System service start failed; attempting manual dockerd launch (best-effort)"
          if command -v dockerd >/dev/null 2>&1; then
            # Launch in background only if not already running
            sudo nohup dockerd > /tmp/dockerd.log 2>&1 &
            for i in $(seq 1 20); do
              sleep 1
              docker info >/dev/null 2>&1 && break
            done
          fi
        fi
        if ! docker info >/dev/null 2>&1; then
          echo "Docker daemon still not reachable. Attempting rootless Docker setup..."
          if [ -f /etc/debian_version ]; then
            echo "Installing rootless prerequisites (uidmap, dbus-user-session, slirp4netns, fuse-overlayfs)"
            sudo apt-get update -y >/dev/null 2>&1 || true
            sudo apt-get install -y uidmap dbus-user-session slirp4netns fuse-overlayfs >/dev/null 2>&1 || true
          fi
          export DOCKER_ROOTLESS=1
          curl -fsSL https://get.docker.com/rootless -o /tmp/get-docker-rootless.sh || true
          if [ -s /tmp/get-docker-rootless.sh ]; then
            sh /tmp/get-docker-rootless.sh || true
          fi
          # Rootless binaries typically placed in ~/bin
          export PATH="$HOME/bin:$PATH"
          if command -v dockerd-rootless.sh >/dev/null 2>&1; then
            echo "Starting rootless dockerd..."
            nohup dockerd-rootless.sh --experimental > /tmp/dockerd-rootless.log 2>&1 &
            for i in $(seq 1 25); do
              sleep 1
              docker info >/dev/null 2>&1 && break || true
            done
          fi
          # Export DOCKER_HOST if default rootless socket exists
          ROOTLESS_SOCK="unix:///run/user/$(id -u)/docker.sock"
          if [ -S "/run/user/$(id -u)/docker.sock" ]; then
            echo "DOCKER_HOST=$ROOTLESS_SOCK" >> "$GITHUB_ENV"
            export DOCKER_HOST=$ROOTLESS_SOCK
          fi
        fi
        if docker info >/dev/null 2>&1; then
          echo "Docker daemon is running (system or rootless)."
        else
          echo "WARNING: Docker daemon unavailable after all attempts. docker build steps may fail." >&2
          # Do NOT exit hard; allow pipeline to decide / possibly use alternative build strategy.
        fi
        docker version --format 'Client: {{.Client.Version}}' 2>/dev/null || docker --version || true
        docker version --format 'Server: {{.Server.Version}}' 2>/dev/null || true
    - name: Azure CLI (if missing)
      shell: bash
      run: |
        set -Eeuo pipefail
        if command -v az >/dev/null 2>&1; then
          echo "Azure CLI already installed: $(az version 2>/dev/null | grep 'azure-cli' || true)"
        else
          echo "Installing Azure CLI..."
          if [ -f /etc/debian_version ]; then
            (curl -sL https://aka.ms/InstallAzureCLIDeb | sudo bash) || { echo "Azure CLI install failed" >&2; exit 1; }
          else
            # Generic script (attempt sudo first, then without)
            (curl -sL https://aka.ms/InstallAzureCli | sudo bash) || (curl -sL https://aka.ms/InstallAzureCli | bash) || { echo "Azure CLI install failed" >&2; exit 1; }
          fi
        fi
        az version | head -n 1 || true
    - name: kubectl (via az aks install-cli)
      shell: bash
      run: |
        set -Eeuo pipefail
        if command -v kubectl >/dev/null 2>&1; then
          echo "kubectl already present: $(kubectl version --client --short 2>/dev/null || true)"
        else
          echo "Installing kubectl using az aks install-cli"
            # Try without sudo first (user-level), then with sudo.
          az aks install-cli || sudo az aks install-cli || true
          if ! command -v kubectl >/dev/null 2>&1; then
            # Fallback: copy from common install locations if script placed it somewhere not in PATH
            if [ -f /usr/local/bin/kubectl ]; then
              cp /usr/local/bin/kubectl "$HOME/.local/bin/kubectl" || true
              chmod +x "$HOME/.local/bin/kubectl" || true
            elif [ -f ./kubectl ]; then
              mv ./kubectl "$HOME/.local/bin/kubectl" || true
              chmod +x "$HOME/.local/bin/kubectl" || true
            fi
          fi
          if ! command -v kubectl >/dev/null 2>&1; then
            echo "kubectl install failed" >&2
            exit 1
          fi
        fi
        kubectl version --client --short || true
    - name: Helm (if missing)
      shell: bash
      run: |
        set -Eeuo pipefail
        if command -v helm >/dev/null 2>&1; then
          echo "Helm already present: $(helm version --short 2>/dev/null || true)"
        else
          echo "Installing Helm (latest)"
          export HELM_INSTALL_DIR="$HOME/.local/bin"
          export USE_SUDO=false
          mkdir -p "$HELM_INSTALL_DIR"
          export PATH="$HOME/.local/bin:$PATH"
          curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
          if ! command -v helm >/dev/null 2>&1; then
            echo "Helm not found after install attempt" >&2
            ls -l "$HOME/.local/bin" || true
            exit 1
          fi
        fi
        helm version --short || true
    - name: Summary
      shell: bash
      run: |
        echo "Tool versions:";
        (command -v az >/dev/null 2>&1 && az version | head -n 1) || echo "az: missing";
        (command -v kubectl >/dev/null 2>&1 && kubectl version --client --short) || echo "kubectl: missing";
        (command -v helm >/dev/null 2>&1 && helm version --short) || echo "helm: missing";
        (command -v docker >/dev/null 2>&1 && docker --version) || echo "docker: missing";
        if command -v docker >/dev/null 2>&1; then
          if docker info >/dev/null 2>&1; then echo "Docker daemon: reachable"; else echo "Docker daemon: NOT reachable"; fi
        fi
        echo "First PATH entries:"; echo "$PATH" | tr ':' '\n' | head -n 10;
        echo "Setup Azure Tooling complete."
