name: "Setup Azure Tooling"
description: "Installs Azure CLI, kubectl, kubelogin, and Helm on self-hosted ARC runners"
inputs:
  helm-version:
    description: "Specific Helm version (e.g. v3.15.0). If empty, latest script-managed version is installed."
    required: false
    default: ""
  kubectl-version:
    description: "Specific kubectl version (e.g. v1.30.3). If empty, latest stable is used."
    required: false
    default: ""
  architecture:
    description: "Override architecture (amd64, arm64, arm, ppc64le, s390x). Auto-detected if blank."
    required: false
    default: ""
runs:
  using: "composite"
  steps:
    - name: Prepare user bin directory
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p "$HOME/.local/bin"
        echo "Prepared user bin directory at $HOME/.local/bin"
    - name: Detect architecture
      id: arch
      shell: bash
      run: |
        set -euo pipefail
        INPUT_ARCH="${{ inputs.architecture }}"
        if [ -n "$INPUT_ARCH" ]; then
          ARCH_NORM="$INPUT_ARCH"
        else
          RAW=$(uname -m)
          case "$RAW" in
            x86_64|amd64) ARCH_NORM=amd64 ;;
            aarch64|arm64) ARCH_NORM=arm64 ;;
            armv7l|armv7) ARCH_NORM=arm ;;
            ppc64le) ARCH_NORM=ppc64le ;;
            s390x) ARCH_NORM=s390x ;;
            *) echo "Unknown architecture $RAW; defaulting to amd64"; ARCH_NORM=amd64 ;;
          esac
        fi
        echo "normalized_arch=$ARCH_NORM" >> $GITHUB_OUTPUT
        echo "Detected/Selected architecture: $ARCH_NORM"
    - name: Install Azure CLI (if missing)
      id: install-az
      shell: bash
      run: |
        set -euo pipefail
        if command -v az >/dev/null 2>&1; then
          echo "Azure CLI already present: $(az version 2>/dev/null | grep 'azure-cli' || true)"
        else
          echo "Installing Azure CLI..."
          # Detect distro (assuming Debian/Ubuntu for ARC runner base). Adjust if needed.
          if [ -f /etc/debian_version ]; then
            curl -sL https://aka.ms/InstallAzureCLIDeb | sudo bash
          else
            curl -sL https://aka.ms/InstallAzureCli | bash
          fi
        fi
        az version | head -n 1 || true

    - name: Install kubectl (if missing)
      shell: bash
      run: |
        set -euo pipefail
        if command -v kubectl >/dev/null 2>&1; then
          echo "kubectl already installed: $(kubectl version --client --short 2>/dev/null || true)"
        else
          echo "Installing kubectl (direct download)"
          REQ_VER="${{ inputs.kubectl-version }}"
          if [ -z "$REQ_VER" ]; then
            REQ_VER=$(curl -Ls https://dl.k8s.io/release/stable.txt)
          fi
          ARCH="${{ steps.arch.outputs.normalized_arch }}"
          OS=linux
          echo "Using kubectl version: $REQ_VER (arch: $ARCH)"
          curl -L "https://dl.k8s.io/release/${REQ_VER}/bin/${OS}/${ARCH}/kubectl" -o "$HOME/.local/bin/kubectl"
          chmod +x "$HOME/.local/bin/kubectl"
          echo "Installed kubectl: $($HOME/.local/bin/kubectl version --client --short 2>/dev/null || true)"
        fi

    - name: Install kubelogin (if missing)
      shell: bash
      run: |
        set -euo pipefail
        if command -v kubelogin >/dev/null 2>&1; then
          echo "kubelogin already installed: $(kubelogin --version 2>/dev/null || true)"
          exit 0
        fi
        echo "Installing kubelogin..."
        OS=linux
        ARCH="${{ steps.arch.outputs.normalized_arch }}"
        # Fetch latest tag
        VERSION=$(curl -s https://api.github.com/repos/Azure/kubelogin/releases/latest | grep tag_name | cut -d '"' -f4)
        echo "Latest kubelogin release: $VERSION"
        curl -sSL -o kubelogin.tgz "https://github.com/Azure/kubelogin/releases/download/${VERSION}/kubelogin-${OS}-${ARCH}.tar.gz"
        tar -xzf kubelogin.tgz
        if [ -f kubelogin ]; then
          mv kubelogin "$HOME/.local/bin/"
        else
          mv bin/${OS}_${ARCH}/kubelogin "$HOME/.local/bin/"
        fi
        rm -rf kubelogin.tgz bin
        chmod +x "$HOME/.local/bin/kubelogin"
        kubelogin --version || true

    - name: Install Helm (if missing or version requested)
      shell: bash
      run: |
        set -euo pipefail
        WANT="${{ inputs.helm-version }}"
        if command -v helm >/dev/null 2>&1; then
          CURR=$(helm version --short 2>/dev/null || true)
          echo "Existing Helm: $CURR"
          if [ -n "$WANT" ] && ! echo "$CURR" | grep -q "$WANT"; then
            echo "Re-installing Helm to match $WANT"
          else
            if [ -z "$WANT" ]; then
              echo "Keeping existing Helm installation."; exit 0
            fi
          fi
        fi
        echo "Installing Helm (requested version: ${WANT:-latest})"
        export HELM_INSTALL_DIR="$HOME/.local/bin"
        export USE_SUDO=false
        mkdir -p "$HELM_INSTALL_DIR"
        if [ -n "$WANT" ]; then
          curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash -s -- --version "$WANT"
        else
          curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
        fi
        helm version --short || true

    - name: Add tool directories to PATH
      shell: bash
      run: |
        set -euo pipefail
        # Collect potential install locations and append if not already present.
        ADDED=0
        for d in "$HOME/.local/bin" /usr/local/bin /usr/bin "$HOME/bin"; do
          if [ -d "$d" ]; then
            # Avoid duplicate lines in $GITHUB_PATH (GitHub does not deduplicate automatically across runs)
            if ! echo "$PATH" | tr ':' '\n' | grep -Fxq "$d"; then
              echo "$d" >> "$GITHUB_PATH"
              ADDED=$((ADDED+1))
            fi
          fi
        done
        echo "Appended $ADDED directory(ies) to PATH context.";
        echo "Resulting PATH preview:";
        echo "$PATH" | tr ':' '\n' | head -n 25

    - name: Summary
      shell: bash
      run: |
        echo "Tool versions:";
        command -v az && az version | head -n 1 || echo "az missing";
        command -v kubectl && kubectl version --client --short || echo "kubectl missing";
        command -v kubelogin && kubelogin --version || echo "kubelogin missing";
        command -v helm && helm version --short || echo "helm missing";
        echo "Architecture used: ${{ steps.arch.outputs.normalized_arch }}";
        echo "kubectl desired version input: '${{ inputs.kubectl-version }}'";
