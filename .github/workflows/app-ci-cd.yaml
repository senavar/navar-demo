name: Application CI/CD Pipeline

on:
  push:
    branches: [ main ]
    tags: [ 'v*.*.*' ]
    paths:
      - 'app/frontend/**'
      - 'app/backend/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'app/frontend/**'
      - 'app/backend/**'
  workflow_dispatch:
    inputs:
      deploy_to_dev:
        description: 'Deploy to dev environment after image build (true/false)'
        required: false
        default: 'false'
      push_images:
        description: 'Push built images to registry (true/false)'
        required: false
        default: 'false'

permissions:
  contents: read
  id-token: write
  packages: write
  security-events: write

env:
  REGISTRY_DEV: ${{ vars.REGISTRY_DEV}}
  REGISTRY_PROD: ${{ vars.REGISTRY_PROD }}
  NAMESPACE: ${{ vars.NAMESPACE }}
  FRONTEND_DIR: app/frontend
  BACKEND_DIR: app/backend
  BACKUP_DIR: app/mongoscript

jobs:
  scan:
    name: Microsoft Defender for Cloud - Code Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      actions: read
      security-events: write
    steps:
    - name: Checkout Code to Scan
      uses: actions/checkout@v3
    - name: Run Microsoft Security DevOps
      uses: microsoft/security-devops-action@latest
      id: msdo
    - name: Upload alerts to Security tab
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: ${{ steps.msdo.outputs.sarifFile }}

  setup:
    name: Setup - Determine Versioning and SHA
    runs-on: arc-runner-set-dev
    needs: scan
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
      - name: Generate SHA
        id: metadata
        run: echo "shortsha=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT
      - name: Determine Semantic Version
        id: setversion
        run: |
          if [[ "$GITHUB_REF" =~ refs/tags/v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
          else
            echo "version=" >> $GITHUB_OUTPUT
          fi
    outputs:
      SEMVER: ${{ steps.setversion.outputs.version }}
      SHORT_SHA: ${{ steps.metadata.outputs.shortsha }}

  build:
    name: Build and Push Images + Helm Chart to Dev ACR
    runs-on: arc-runner-set-dev
    needs: setup
    env:
      SEMVER: ${{ needs.setup.outputs.SEMVER }}
      SHORT_SHA: ${{ needs.setup.outputs.SHORT_SHA }}
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
      - name: Determine Build / Tag Strategy
        id: pushpolicy
        run: |
          # Always perform ACR remote builds (they inherently push) for all event types
          # If workflow_dispatch with push_images=false, still build & push (requirement: dev registry must have images) but mark it as 'non-promotable'.
          ALLOW=true
          PROMOTABLE=false
          if [[ "${GITHUB_REF}" =~ refs/tags/v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            PROMOTABLE=true
          elif [[ "${GITHUB_REF}" == "refs/heads/main" ]]; then
            PROMOTABLE=true
          fi
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" && "${{ github.event.inputs.push_images }}" == "false" ]]; then
            # Force non-promotable, but still allow push to dev
            PROMOTABLE=false
          fi
          echo "allow_push=$ALLOW" >> $GITHUB_OUTPUT
          echo "promotable=$PROMOTABLE" >> $GITHUB_OUTPUT
          echo "ALLOW_PUSH=$ALLOW" >> $GITHUB_ENV
          echo "PROMOTABLE=$PROMOTABLE" >> $GITHUB_ENV
      - name: Setup Azure Tooling (az, kubectl, helm)
        uses: ./.github/actions/setup-azure-tools
      - name: Azure Login
        if: steps.pushpolicy.outputs.allow_push == 'true'
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      - name: Build Frontend (ACR Remote)
        id: build_frontend
        run: |
          if [ "$ALLOW_PUSH" != "true" ]; then
            echo "Skipping remote build (policy disallows push)."
            echo "digest=" >> $GITHUB_OUTPUT
            exit 0
          fi
          ACR_NAME=${REGISTRY_DEV%%.*}
          SHORT="${SHORT_SHA}"
          if [ -n "${SEMVER}" ]; then
            PRIMARY_TAG="${SEMVER}"
            SECONDARY_TAG="sha-${SHORT}"
            echo "Starting ACR build for frontend with tags: $PRIMARY_TAG and $SECONDARY_TAG"
            az acr build \
              --registry "$ACR_NAME" \
              --image birthdayapp/frontend:${PRIMARY_TAG} \
              --image birthdayapp/frontend:${SECONDARY_TAG} \
              "${{ env.FRONTEND_DIR }}"
          else
            PRIMARY_TAG="sha-${SHORT}"
            echo "Starting ACR build for frontend with tag: $PRIMARY_TAG"
            az acr build \
              --registry "$ACR_NAME" \
              --image birthdayapp/frontend:${PRIMARY_TAG} \
              "${{ env.FRONTEND_DIR }}"
          fi
          # Retrieve digest (same for all tags pointing to this manifest)
          DIGEST=$(az acr repository show-manifests --name "$ACR_NAME" --repository birthdayapp/frontend \
            --query "[?contains(tags, '${PRIMARY_TAG}')].digest" -o tsv | head -n 1)
          if [ -z "$DIGEST" ]; then
            echo "Failed to obtain digest for frontend image" >&2
            exit 1
          fi
          echo "digest=$DIGEST" >> $GITHUB_OUTPUT
          
          az acr build \
              --registry "$ACR_NAME" \
              --image mongodb/backupscript:dev\
              "${{ env.BACKUP_DIR }}"

      - name: Build Backend (ACR Remote)
        id: build_backend
        run: |
          if [ "$ALLOW_PUSH" != "true" ]; then
            echo "Skipping remote build (policy disallows push)."
            echo "digest=" >> $GITHUB_OUTPUT
            exit 0
          fi
          ACR_NAME=${REGISTRY_DEV%%.*}
          SHORT="${SHORT_SHA}"
          if [ -n "${SEMVER}" ]; then
            PRIMARY_TAG="${SEMVER}"
            SECONDARY_TAG="sha-${SHORT}"
            echo "Starting ACR build for backend with tags: $PRIMARY_TAG and $SECONDARY_TAG"
            az acr build \
              --registry "$ACR_NAME" \
              --image birthdayapp/backend:${PRIMARY_TAG} \
              --image birthdayapp/backend:${SECONDARY_TAG} \
              "${{ env.BACKEND_DIR }}"
          else
            PRIMARY_TAG="sha-${SHORT}"
            echo "Starting ACR build for backend with tag: $PRIMARY_TAG"
            az acr build \
              --registry "$ACR_NAME" \
              --image birthdayapp/backend:${PRIMARY_TAG} \
              "${{ env.BACKEND_DIR }}"
          fi
          DIGEST=$(az acr repository show-manifests --name "$ACR_NAME" --repository birthdayapp/backend \
            --query "[?contains(tags, '${PRIMARY_TAG}')].digest" -o tsv | head -n 1)
          if [ -z "$DIGEST" ]; then
            echo "Failed to obtain digest for backend image" >&2
            exit 1
          fi
          echo "digest=$DIGEST" >> $GITHUB_OUTPUT
      - id: digest_frontend
        run: echo "digest=${{ steps.build_frontend.outputs.digest }}" >> $GITHUB_OUTPUT
      - id: digest_backend
        run: echo "digest=${{ steps.build_backend.outputs.digest }}" >> $GITHUB_OUTPUT
      - name: Lint Helm Chart
        run: |
          helm lint k8s/manifests/charts/birthdayapp
      - name: Package Helm Chart
        id: package_helm_chart
        run: |
          set -euo pipefail
          mkdir -p dist
          # Construct an OCI-safe chart version (no '+') for non-semver builds
          if [ -n "${{ needs.setup.outputs.SEMVER }}" ]; then
            PKG_VERSION="${{ needs.setup.outputs.SEMVER }}"
            APP_VERSION="${{ needs.setup.outputs.SEMVER }}"
          else
            PKG_VERSION="0.1.0-sha.${{ needs.setup.outputs.SHORT_SHA }}"
            APP_VERSION="${{ needs.setup.outputs.SHORT_SHA }}"
          fi
          echo "Chart Version: $PKG_VERSION  App Version: $APP_VERSION"
          CHART_DIR=k8s/manifests/charts/birthdayapp
          helm package "$CHART_DIR" --version "$PKG_VERSION" --app-version "$APP_VERSION" -d dist
          CHART_TGZ=$(ls dist/birthdayapp-*.tgz)
          echo "Packaged chart: $CHART_TGZ"
          # Login to dev ACR for Helm (token based, no docker)
          TOKEN_JSON=$(az acr login --name "$REGISTRY_DEV" --expose-token -o json)
          DEV_TOKEN=$(echo "$TOKEN_JSON" | jq -r '.accessToken')
          if [ -z "$DEV_TOKEN" ]; then echo "Failed to get ACR token for Helm push" >&2; exit 1; fi
          # Helm OCI push (ensure OCI is enabled)
          export HELM_EXPERIMENTAL_OCI=1
          DEV_REGISTRY_FQDN="${REGISTRY_DEV}.azurecr.io"
          helm registry login $DEV_REGISTRY_FQDN --username 00000000-0000-0000-0000-000000000000 --password "$DEV_TOKEN"
          helm push "$CHART_TGZ" oci://$DEV_REGISTRY_FQDN/helm
          echo "Helm chart pushed to oci://$DEV_REGISTRY_FQDN/helm/birthdayapp:$PKG_VERSION"
          echo "chart_version=$PKG_VERSION" >> $GITHUB_OUTPUT
    outputs:
      FRONTEND_DIGEST: ${{ steps.digest_frontend.outputs.digest }}
      BACKEND_DIGEST: ${{ steps.digest_backend.outputs.digest }}
      CHART_VERSION: ${{ steps.package_helm_chart.outputs.chart_version }}

  deploy-dev:
    name: Deploy to Dev AKS with Helm
    runs-on: arc-runner-set-dev
    environment: development
    needs: [setup, build]
    # Skip for pull_request events (dry build only). Allow for push/tag or manual dispatch based on inputs.
    if: github.event_name != 'pull_request' && ( github.event_name != 'workflow_dispatch' || (github.event.inputs.deploy_to_dev == 'true' && github.event.inputs.push_images != 'false') )
    env:
      FRONTEND_DIGEST: ${{ needs.build.outputs.FRONTEND_DIGEST }}
      BACKEND_DIGEST: ${{ needs.build.outputs.BACKEND_DIGEST }}
      SEMVER: ${{ needs.setup.outputs.SEMVER }}
      SHORT_SHA: ${{ needs.setup.outputs.SHORT_SHA }}
      CHART_VERSION: ${{ needs.build.outputs.CHART_VERSION }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup Azure Tooling (az, kubectl, helm)
        uses: ./.github/actions/setup-azure-tools
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      - name: Deploy with Helm to Dev AKS
        run: |
          FRONT="$FRONTEND_DIGEST"
          BACK="$BACKEND_DIGEST"
          az aks get-credentials -g ${{ secrets.AKS_RESOURCE_GROUP_DEV }} -n ${{ secrets.AKS_CLUSTER_NAME_DEV }} --overwrite-existing
          kubelogin convert-kubeconfig -l azurecli
          if [ -z "$FRONT" ] || [ -z "$BACK" ]; then
            echo "Image digests empty (build-only run). Skipping Helm deploy."; exit 0
          fi
          RELEASE=birthdayapp
          DEV_REGISTRY_FQDN="${REGISTRY_DEV}.azurecr.io"
          CHART_REF=oci://$DEV_REGISTRY_FQDN/helm/birthdayapp
          CVERSION="$CHART_VERSION"
          APP_VERSION="${SEMVER:-$SHORT_SHA}"
          # appVersionOverride feeds version label; cannot override Chart.appVersion at runtime
          export HELM_EXPERIMENTAL_OCI=1
          TOKEN_JSON=$(az acr login --name "$REGISTRY_DEV" --expose-token -o json)
          DEV_TOKEN=$(echo "$TOKEN_JSON" | jq -r '.accessToken')
          if [ -z "$DEV_TOKEN" ]; then echo "Failed to get ACR token for Helm pull" >&2; exit 1; fi
          helm registry login $DEV_REGISTRY_FQDN --username 00000000-0000-0000-0000-000000000000 --password "$DEV_TOKEN"
          helm pull "$CHART_REF" --version "$CVERSION" -d /tmp --untar
          helm upgrade --install "$RELEASE" "$CHART_REF" --version "$CVERSION" \
            --namespace "${NAMESPACE}" \
            --set global.registry="$DEV_REGISTRY_FQDN" \
            --set global.namespace="${NAMESPACE}" \
            --set image.frontend.digest="$FRONT" --set image.frontend.tag="placeholder" \
            --set image.backend.digest="$BACK" --set image.backend.tag="placeholder" \
            --set azureBlob.enabled=true \
            --set azureBlob.accountName=${{ secrets.AZURE_STORAGE_ACCOUNT_NAME_DEV }} \
            --set azureBlob.container=${{ secrets.AZURE_BLOB_CONTAINER_NAME_DEV }} \
            --set serviceAccountName=birthdayapp-sa \
            --set appVersionOverride="$APP_VERSION" \
            --set ingress.host="dev.birthday.losnavar.com" \
            --history-max=10
          kubectl rollout status deployment/frontend -n "${NAMESPACE}" --timeout=180s || true
          kubectl rollout status deployment/backend -n "${NAMESPACE}" --timeout=180s || true
          kubectl apply -f app/mongoscript/mongo-backup-cronjob.yaml -n "$NAMESPACE" || true
          kubectl get clusterrolebinding birthdayapp-sa-admin || kubectl create clusterrolebinding birthdayapp-sa-admin --clusterrole=cluster-admin --serviceaccount=birthdayapp:birthdayapp-sa
  promote-prod:
    name: Promote Images and Deploy to Prod AKS with Helm
    runs-on: arc-runner-set-prod
    needs: [ setup, build, deploy-dev ]
    # Only run when this workflow was triggered by a semantic version tag (vX.Y.Z)
    if: startsWith(github.ref, 'refs/tags/v') && needs.setup.outputs.SEMVER != ''
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Setup Azure Tooling (az, kubectl, helm)
        uses: ./.github/actions/setup-azure-tools
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      - name: Promote images to prod ACR (client copy)
        env:
          SEMVER: ${{ needs.setup.outputs.SEMVER }}
          SHORT_SHA: ${{ needs.setup.outputs.SHORT_SHA }}
          CHART_VERSION: ${{ needs.build.outputs.CHART_VERSION }}
        run: |
          set -euo pipefail
          DEV_ACR_NAME=${REGISTRY_DEV}
          PROD_ACR_NAME=${REGISTRY_PROD}
          echo "Obtaining access tokens for ACRs without docker daemon (using --expose-token)"
          DEV_TOKEN_JSON=$(az acr login --name "$REGISTRY_DEV" --expose-token -o json)
          PROD_TOKEN_JSON=$(az acr login --name "$REGISTRY_PROD" --expose-token -o json)
          DEV_PASSWORD=$(echo "$DEV_TOKEN_JSON" | jq -r '.accessToken')
          PROD_PASSWORD=$(echo "$PROD_TOKEN_JSON" | jq -r '.accessToken')
          if [ -z "$DEV_PASSWORD" ] || [ -z "$PROD_PASSWORD" ]; then
            echo "Failed to obtain registry tokens" >&2; exit 1; fi
          echo "Logging into registries with crane auth login"
          DEV_REGISTRY_FQDN="${REGISTRY_DEV}.azurecr.io"
          PROD_REGISTRY_FQDN="${REGISTRY_PROD}.azurecr.io"
          crane auth login $DEV_REGISTRY_FQDN -u 00000000-0000-0000-0000-000000000000 -p "$DEV_PASSWORD"
          crane auth login $PROD_REGISTRY_FQDN -u 00000000-0000-0000-0000-000000000000 -p "$PROD_PASSWORD"
          echo "ACR token-based auth configured for crane operations"

          FRONT=${{ needs.build.outputs.FRONTEND_DIGEST }}
          BACK=${{ needs.build.outputs.BACKEND_DIGEST }}
          if [ -z "$FRONT" ] || [ -z "$BACK" ]; then
            echo "Missing digest(s); cannot promote." >&2
            exit 1
          fi
            # Build tag list for prod
          TAGS="prod sha-${SHORT_SHA}"
          if [ -n "$SEMVER" ]; then
            TAGS="prod $SEMVER sha-${SHORT_SHA}"
          fi
          echo "Promoting digests to prod with tags: $TAGS"
          for TAG in $TAGS; do
            echo "Copying frontend@$FRONT to ${PROD_REGISTRY_FQDN}/birthdayapp/frontend:${TAG}" 
            crane copy ${DEV_REGISTRY_FQDN}/birthdayapp/frontend@${FRONT} ${PROD_REGISTRY_FQDN}/birthdayapp/frontend:${TAG}
            echo "Copying backend@$BACK to ${PROD_REGISTRY_FQDN}/birthdayapp/backend:${TAG}" 
            crane copy ${DEV_REGISTRY_FQDN}/birthdayapp/backend@${BACK} ${PROD_REGISTRY_FQDN}/birthdayapp/backend:${TAG}
          done
          # Promote Helm chart
          if [ -n "$CHART_VERSION" ]; then
            echo "Copying Helm chart birthdayapp:$CHART_VERSION to prod registry"
            crane copy ${DEV_REGISTRY_FQDN}/helm/birthdayapp:${CHART_VERSION} ${PROD_REGISTRY_FQDN}/helm/birthdayapp:${CHART_VERSION}
          else
            echo "No chart version found; skipping chart promotion" >&2
          fi
          echo "Promotion copy complete"

          az acr build \
              --registry "$PROD_ACR_NAME" \
              --image mongodb/backupscript:prod\
              "${{ env.BACKUP_DIR }}"

      - name: Deploy to prod AKS with Helm
        env:
          FRONTEND_DIGEST: ${{ needs.build.outputs.FRONTEND_DIGEST }}
          BACKEND_DIGEST: ${{ needs.build.outputs.BACKEND_DIGEST }}
          SEMVER: ${{ needs.setup.outputs.SEMVER }}
          CHART_VERSION: ${{ needs.build.outputs.CHART_VERSION }}
        run: |
          PROD_NS="birthdayapp" 
          az aks get-credentials -g ${{ secrets.AKS_RESOURCE_GROUP_PROD }} -n ${{ secrets.AKS_CLUSTER_NAME_PROD }} --overwrite-existing
          kubelogin convert-kubeconfig -l azurecli
          FRONT="$FRONTEND_DIGEST"
          BACK="$BACKEND_DIGEST"
          if [ -z "$FRONT" ] || [ -z "$BACK" ]; then
            echo "Missing digests; cannot deploy to prod."; exit 1
          fi
          RELEASE=birthdayapp
          PROD_REGISTRY_FQDN="${REGISTRY_PROD}.azurecr.io"
          CHART_REF=oci://$PROD_REGISTRY_FQDN/helm/birthdayapp
          CVERSION="$CHART_VERSION"
          APP_VERSION="$SEMVER"
          # Use appVersionOverride for runtime version labeling
          export HELM_EXPERIMENTAL_OCI=1
          TOKEN_JSON=$(az acr login --name "$REGISTRY_PROD" --expose-token -o json)
          PROD_TOKEN=$(echo "$TOKEN_JSON" | jq -r '.accessToken')
            if [ -z "$PROD_TOKEN" ]; then echo "Failed to get ACR token for Helm pull (prod)" >&2; exit 1; fi
          helm registry login $PROD_REGISTRY_FQDN --username 00000000-0000-0000-0000-000000000000 --password "$PROD_TOKEN"
          helm pull "$CHART_REF" --version "$CVERSION" -d /tmp --untar || true
          helm upgrade --install "$RELEASE" "$CHART_REF" --version "$CVERSION" \
            --namespace "${PROD_NS}" \
            --set global.registry="$PROD_REGISTRY_FQDN" \
            --set global.namespace="$PROD_NS" \
            --set image.frontend.digest="$FRONT" --set image.frontend.tag="placeholder" \
            --set image.backend.digest="$BACK" --set image.backend.tag="placeholder" \
            --set azureBlob.enabled=true \
            --set azureBlob.accountName=${{ secrets.AZURE_STORAGE_ACCOUNT_NAME_PROD }} \
            --set azureBlob.container=${{ secrets.AZURE_BLOB_CONTAINER_NAME_PROD }} \
            --set serviceAccountName=birthdayapp-sa \
            --set appVersionOverride="$APP_VERSION" \
            --set networkPolicy.backend.mongoCIDR="10.20.3.4/32"
            --history-max=20
          kubectl rollout status deployment/frontend -n "$PROD_NS" --timeout=180s || true
          kubectl rollout status deployment/backend -n "$PROD_NS" --timeout=180s || true
          kubectl apply -f app/mongoscript/mongo-backup-cronjob-prod.yaml -n "$PROD_NS"
          kubectl get clusterrolebinding birthdayapp-sa-admin || kubectl create clusterrolebinding birthdayapp-sa-admin --clusterrole=cluster-admin --serviceaccount=birthdayapp:birthdayapp-sa
          echo "Prod deployment done. Version: $APP_VERSION"
