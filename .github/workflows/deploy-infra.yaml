name: Azure Infrastructure CI/CD Pipeline

on:
  push:
    branches:
      - main
    paths:
      - 'infra/iac/**'
  workflow_dispatch:
    inputs:
      run_prod:
        description: 'Also deploy prod after dev (manual runs only)'
        required: false
        type: boolean
        default: false
  pull_request:
    branches:
      - main
    paths:
      - 'infra/iac/**'

env:
  ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  TF_STATE_RESOURCE_GROUP: ${{ secrets.TF_STATE_RESOURCE_GROUP }}
  TF_STATE_STORAGE_ACCOUNT: ${{ secrets.TF_STATE_STORAGE_ACCOUNT }}
  TF_STATE_CONTAINER: ${{ secrets.TF_STATE_CONTAINER }}
  TF_STATE_PREFIX: core

concurrency:
  group: infra-terraform
  cancel-in-progress: false

jobs:
  scan:
    name: Microsoft Defender for Cloud - Code Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      actions: read
      security-events: write
    steps:
    - name: Checkout Code to Scan
      uses: actions/checkout@v3
    - name: Run Microsoft Security DevOps
      uses: microsoft/security-devops-action@latest
      id: msdo
    - name: Upload alerts to Security tab
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: ${{ steps.msdo.outputs.sarifFile }}

  terraform-dev:
    name: 'Terraform Infra for Dev'
    runs-on: ubuntu-latest
    environment: development
    defaults:
      run:
        working-directory: ./infra/iac
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      - name: Terraform Init (Remote Backend - Dev)
        run: |
          terraform init \
            -backend-config="resource_group_name=${TF_STATE_RESOURCE_GROUP}" \
            -backend-config="storage_account_name=${TF_STATE_STORAGE_ACCOUNT}" \
            -backend-config="container_name=${TF_STATE_CONTAINER}" \
            -backend-config="key=${TF_STATE_PREFIX}-dev.tfstate"
      - name: Terraform Validate
        run: terraform validate
      - name: Plan Core (Dev)
        run: terraform plan -var-file=dev.tfvars -target="module.core" -out=tfplan-core -input=false
      - name: Apply Core (Dev)
        run: terraform apply -auto-approve tfplan-core
      - name: Import PFX into Key Vault (creates new version if exists)
        run: |
          set -e
          KV_NAME=$(terraform output -raw key_vault_name)
          CERT_NAME="APP_TLS_CERT"
          if [ -z "${{ secrets.APPGW_PFX_BASE64 }}" ]; then
            echo "APPGW_PFX_BASE64 secret is empty" >&2; exit 1; fi
          echo "Decoding PFX..."
          echo "${{ secrets.APPGW_PFX_BASE64 }}" | base64 -d > cert.pfx || { echo "Base64 decode failed" >&2; exit 1; }
          # Basic sanity: file non‑zero and PKCS#12 signature
          if [ ! -s cert.pfx ]; then echo "Decoded PFX file is empty" >&2; exit 1; fi
          file cert.pfx || true
          if [ -n "${{ secrets.APPGW_PFX_PASSWORD }}" ]; then
            az keyvault certificate import --vault-name "$KV_NAME" -n "$CERT_NAME" -f cert.pfx --password "${{ secrets.APPGW_PFX_PASSWORD }}"
          else
            az keyvault certificate import --vault-name "$KV_NAME" -n "$CERT_NAME" -f cert.pfx
          fi
          rm -f cert.pfx
      - name: Plan Full (Dev)
        id: plan-full
        run: |
          sudo az aks install-cli
          export PATH="/usr/local/bin:$PATH"
          az aks get-credentials -g ${{ secrets.AKS_RESOURCE_GROUP_DEV }} -n ${{ secrets.AKS_CLUSTER_NAME_DEV }} --overwrite-existing
          kubelogin convert-kubeconfig -l azurecli
          terraform plan -var-file=dev.tfvars -out=tfplan-full
          if terraform show -json tfplan-full | jq -e 'length(.resource_changes) == 0'; then
            echo "is_empty=true" >> $GITHUB_OUTPUT
          else
            echo "is_empty=false" >> $GITHUB_OUTPUT
          fi
      - name: Apply Full (Dev)
        if: steps.plan-full.outputs.is_empty == 'false'
        run: terraform apply -auto-approve tfplan-full
      - name: Setup Helm
        uses: azure/setup-helm@v4
      - name: Kubernetes Cluster Add-Ons
        env:
          GITHUB_PAT: ${{ secrets.GH_RUNNER_PAT }}
          GITHUB_TARGET: your-org   # or your-org/your-repo
        run: ./k8s/bootstrap/cluster_addons.sh
      - name: Apply Mongo Backup Script ConfigMap (Dev)
        run: |
          kubectl apply -f app/script/mongo-backup-configmap.yaml
      - name: Apply Mongo Backup CronJob (Dev)
        run: |
          kubectl apply -f app/script/mongo-backup-cronjob.yaml
          kubectl get cronjob mongo-backup -n birthdayapp -o wide

  terraform-prod:
    name: 'Terraform Infra for Prod'
    runs-on: ubuntu-latest
    needs: terraform-dev
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.run_prod)
    environment: production
    defaults:
      run:
        working-directory: ./infra/iac
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      - name: Terraform Init (Remote Backend - Prod)
        run: |
          terraform init \
            -backend-config="resource_group_name=${TF_STATE_RESOURCE_GROUP}" \
            -backend-config="storage_account_name=${TF_STATE_STORAGE_ACCOUNT}" \
            -backend-config="container_name=${TF_STATE_CONTAINER}" \
            -backend-config="key=${TF_STATE_PREFIX}-prod.tfstate"
      - name: Terraform Validate
        run: terraform validate
      - name: Plan Core (Prod)
        run: terraform plan -var-file=prod.tfvars -target="module.core" -out=tfplan-core -input=false
      - name: Apply Core (Prod)
        run: terraform apply -auto-approve tfplan-core
      - name: Import PFX into Key Vault (creates new version if exists)
        run: |
          set -e
          KV_NAME=$(terraform output -raw key_vault_name)
          CERT_NAME="APP_TLS_CERT"
          if [ -z "${{ secrets.APPGW_PFX_BASE64 }}" ]; then
            echo "APPGW_PFX_BASE64 secret is empty" >&2; exit 1; fi
          echo "Decoding PFX..."
          echo "${{ secrets.APPGW_PFX_BASE64 }}" | base64 -d > cert.pfx || { echo "Base64 decode failed" >&2; exit 1; }
          if [ ! -s cert.pfx ]; then echo "Decoded PFX file is empty" >&2; exit 1; fi
          file cert.pfx || true
          if [ -n "${{ secrets.APPGW_PFX_PASSWORD }}" ]; then
            az keyvault certificate import --vault-name "$KV_NAME" -n "$CERT_NAME" -f cert.pfx --password "${{ secrets.APPGW_PFX_PASSWORD }}"
          else
            az keyvault certificate import --vault-name "$KV_NAME" -n "$CERT_NAME" -f cert.pfx
          fi
          rm -f cert.pfx
      - name: Plan Full (Prod)
        id: plan-full
        run: |
          sudo az aks install-cli
          export PATH="/usr/local/bin:$PATH"
          az aks get-credentials -g ${{ secrets.AKS_RESOURCE_GROUP_PROD }} -n ${{ secrets.AKS_CLUSTER_NAME_PROD }} --overwrite-existing
          kubelogin convert-kubeconfig -l azurecli
          terraform plan -var-file=prod.tfvars -out=tfplan-full
          if terraform show -json tfplan-full | jq -e 'length(.resource_changes) == 0'; then
            echo "is_empty=true" >> $GITHUB_OUTPUT
          else
            echo "is_empty=false" >> $GITHUB_OUTPUT
          fi
      - name: Apply Full (Prod)
        if: steps.plan-full.outputs.is_empty == 'false'
        run: terraform apply -auto-approve tfplan-full
      - name: Setup Helm
        uses: azure/setup-helm@v4
      - name: Kubernetes Cluster Add-Ons
        env:
          GITHUB_PAT: ${{ secrets.GH_RUNNER_PAT }}
          GITHUB_TARGET: "https://github.com/senavar/navar-demo"
        run: ./k8s/bootstrap/cluster_addons.sh
      - name: Apply Mongo Backup Script ConfigMap (Prod)
        run: |
          kubectl apply -f app/script/mongo-backup-configmap.yaml
      - name: Apply Mongo Backup CronJob (Prod)
        run: |
          kubectl apply -f app/script/mongo-backup-cronjob.yaml
          kubectl get cronjob mongo-backup -n birthdayapp -o wide