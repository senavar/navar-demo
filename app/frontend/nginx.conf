worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
# Use a writable location for pid when running master as non-root
pid        /tmp/nginx.pid;

events { worker_connections 1024; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile        on;
  tcp_nopush      on;
  tcp_nodelay     on;
  keepalive_timeout  65;
  types_hash_max_size 4096;
  server_tokens off;

  # Place temp/cache paths in writable /tmp for non-root runtime
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path       /tmp/proxy_temp;
  fastcgi_temp_path     /tmp/fastcgi_temp;
  uwsgi_temp_path       /tmp/uwsgi_temp;
  scgi_temp_path        /tmp/scgi_temp;

  # Security headers
  add_header X-Content-Type-Options nosniff;
  add_header X-Frame-Options DENY;
  add_header X-XSS-Protection "1; mode=block";
  add_header Referrer-Policy no-referrer-when-downgrade;
  add_header Permissions-Policy "geolocation=(), microphone=(), camera=()";
  add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'; script-src 'self'; font-src 'self' data:;";

  map $uri $cache_control_header {
    ~*\.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$  "public, max-age=31536000, immutable";
    default                                        "no-cache";
  }

  server {
    listen 8080;
    listen [::]:8080;
    root /usr/share/nginx/html;
    index index.html;

    location / {
      try_files $uri /index.html;
      add_header Cache-Control $cache_control_header;
    }

    # Health endpoint
    location = /healthz { return 200 '{"status":"ok"}'; add_header Content-Type application/json; }

    # Static files explicit caching
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
      add_header Cache-Control $cache_control_header;
    }
  }
}
